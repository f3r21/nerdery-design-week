/* ===== Vello design-system tokens, verbatim from vello-design-system.vercel.app  ===== */
/* ============================================================
   VELLO · COLOR TOKENS
   Cozy, literary, neighborhood-grounded (Fable-inspired).
   Warm cream paper + deep forest brand + olive/moss primary
   action + persimmon accent + amber for ratings.
   ============================================================ */

:root {
  /* ---- Neutrals (warm cream + near-black ink) ---- */
  --ink-900: #1B1C18; /* primary text, near-black buttons */
  --ink-800: #292A24;
  --ink-700: #3D3F37; /* body text */
  --ink-600: #54564C;
  --ink-500: #6E7064; /* secondary text */
  --ink-400: #8D8F80; /* muted / placeholder */
  --ink-300: #B6B7A6;
  --ink-200: #D6D6C6; /* strong borders */
  --ink-150: #E5E4D6; /* default borders */
  --ink-100: #EFEEE1; /* hairlines, sunken fills */
  --paper:   #F6F2E7; /* app background — warm Fable cream */
  --paper-2: #EFEADB; /* deeper cream section band */
  --white:   #FFFFFF;

  /* ---- Forest (deep brand green: splash, hero, dark surfaces) ---- */
  --forest-900: #0E3A28;
  --forest-800: #16462F; /* splash / hero field */
  --forest-700: #1D5337;
  --forest-600: #266B49;
  --forest-300: #8FB6A2;
  --forest-100: #DCE9E1;

  /* ---- Green = olive / moss (PRIMARY action, selected, tints) ---- */
  --green-900: #2B3D15;
  --green-800: #38511E;
  --green-700: #466621; /* press / brand text */
  --green-600: #557E26; /* PRIMARY (olive CTA) */
  --green-500: #6E9A3A;
  --green-400: #8FB663;
  --green-300: #B6CF92;
  --green-200: #D7E3BD;
  --green-100: #EBF1DB;
  --green-50:  #F5F8EC;

  /* ---- Persimmon (warm human accent / secondary CTA) ---- */
  --coral-700: #C5421F;
  --coral-600: #E2552C;
  --coral-500: #F0623B; /* ACCENT */
  --coral-300: #F7A488;
  --coral-100: #FCE3D9;
  --coral-50:  #FEF1EB;

  /* ---- Amber (ratings, sunlight highlights) ---- */
  --amber-700: #C77F12;
  --amber-600: #E09A1F;
  --amber-500: #F4B740; /* star rating fill */
  --amber-100: #FCEFCF;

  /* ---- Sky (info, links, map accents) ---- */
  --sky-700: #235A93;
  --sky-600: #2D6FB5;
  --sky-100: #E1ECF7;

  /* ---- Red (danger) ---- */
  --red-700: #B23636;
  --red-600: #D64545;
  --red-100: #FBE3E3;

  /* ============================================================
     SEMANTIC ALIASES — reference these in components
     ============================================================ */

  /* Surfaces & background */
  --color-bg:           var(--paper);
  --color-bg-subtle:    var(--paper-2);
  --surface-card:       var(--white);
  --surface-raised:     var(--white);
  --surface-sunken:     var(--ink-100);
  --surface-inverse:    var(--ink-900);
  --surface-brand:      var(--green-600);
  --surface-brand-deep: var(--forest-800); /* splash, hero, dark bands */
  --surface-brand-tint: var(--green-100);
  --surface-accent-tint:var(--coral-100);

  /* Text */
  --text-strong:   var(--ink-900);
  --text-body:     var(--ink-700);
  --text-muted:    var(--ink-500);
  --text-subtle:   var(--ink-400);
  --text-inverse:  var(--white);
  --text-brand:    var(--green-700);
  --text-on-brand: var(--white);
  --text-on-deep:  var(--paper);
  --text-link:     var(--sky-600);

  /* Borders */
  --border-subtle:  var(--ink-100);
  --border-default: var(--ink-150);
  --border-strong:  var(--ink-200);
  --border-focus:   var(--green-600);

  /* Brand actions */
  --brand-primary:        var(--green-600);
  --brand-primary-hover:  var(--green-700);
  --brand-primary-press:  var(--green-800);
  --brand-primary-tint:   var(--green-100);
  --brand-on-primary:     var(--white);

  /* Accent (persimmon) */
  --accent:        var(--coral-500);
  --accent-hover:  var(--coral-600);
  --accent-press:  var(--coral-700);
  --accent-tint:   var(--coral-100);
  --accent-on:     var(--white);

  /* Status */
  --rating:        var(--amber-500);
  --info:          var(--sky-600);
  --info-tint:     var(--sky-100);
  --success:       var(--green-600);
  --success-tint:  var(--green-100);
  --warning:       var(--amber-600);
  --warning-tint:  var(--amber-100);
  --danger:        var(--red-600);
  --danger-tint:   var(--red-100);

  /* Focus ring (used as box-shadow) */
  --focus-ring: 0 0 0 3px rgba(85, 126, 38, 0.32);
  --focus-ring-accent: 0 0 0 3px rgba(240, 98, 59, 0.28);
}

/* ============================================================
   VELLO · TYPOGRAPHY TOKENS
   ============================================================ */

:root {
  /* ---- Families ---- */
  --font-display: 'Bricolage Grotesque', 'Hanken Grotesk', system-ui, sans-serif;
  --font-sans:    'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono:    'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;

  /* ---- Weights ---- */
  --fw-regular:  400; /* @kind other */
  --fw-medium:   500; /* @kind other */
  --fw-semibold: 600; /* @kind other */
  --fw-bold:     700; /* @kind other */
  --fw-extra:    800; /* @kind other */

  /* ---- Type scale (px) ---- */
  --text-2xs:  11px;
  --text-xs:   12px;
  --text-sm:   14px;
  --text-base: 16px;
  --text-md:   18px;
  --text-lg:   20px;
  --text-xl:   24px;
  --text-2xl:  30px;
  --text-3xl:  38px;
  --text-4xl:  48px;
  --text-5xl:  60px;
  --text-6xl:  76px;

  /* ---- Line heights ---- */
  --lh-tight:   1.05; /* @kind other */
  --lh-snug:    1.18; /* @kind other */
  --lh-normal:  1.45; /* @kind other */
  --lh-relaxed: 1.6;  /* @kind other */

  /* ---- Letter spacing ---- */
  --ls-tight:   -0.02em; /* @kind other */
  --ls-snug:    -0.01em; /* @kind other */
  --ls-normal:  0;       /* @kind other */
  --ls-wide:    0.04em;  /* @kind other */
  --ls-wider:   0.12em;  /* @kind other */

  /* ---- Semantic roles ---- */
  --display-font:   var(--font-display);
  --display-weight: var(--fw-bold);
  --heading-font:   var(--font-display);
  --heading-weight: var(--fw-semibold);
  --body-font:      var(--font-sans);
  --label-font:     var(--font-sans);
  --label-weight:   var(--fw-semibold);
  --mono-font:      var(--font-mono);
}

/* ============================================================
   VELLO · SPACING, RADII, SHADOWS, MOTION, LAYERS
   4px base rhythm.
   ============================================================ */

:root {
  /* ---- Spacing scale (4px base) ---- */
  --space-0:  0;
  --space-1:  4px;
  --space-2:  8px;
  --space-3:  12px;
  --space-4:  16px;
  --space-5:  20px;
  --space-6:  24px;
  --space-7:  28px;
  --space-8:  32px;
  --space-10: 40px;
  --space-12: 48px;
  --space-16: 64px;
  --space-20: 80px;
  --space-24: 96px;
  --space-32: 128px;

  /* ---- Corner radii (friendly, generous) ---- */
  --radius-xs:   6px;
  --radius-sm:   10px;
  --radius-md:   14px;  /* inputs, small controls */
  --radius-lg:   20px;  /* cards */
  --radius-xl:   28px;  /* feature cards, sheets */
  --radius-2xl:  36px;
  --radius-pill: 999px; /* chips, primary CTAs, avatars */

  /* ---- Shadows (soft, warm-tinted, low) ---- */
  --shadow-xs: 0 1px 2px rgba(25, 28, 25, 0.06);
  --shadow-sm: 0 2px 6px rgba(25, 28, 25, 0.07);
  --shadow-md: 0 6px 18px rgba(25, 28, 25, 0.09);
  --shadow-lg: 0 14px 34px rgba(25, 28, 25, 0.11);
  --shadow-xl: 0 26px 60px rgba(25, 28, 25, 0.16);
  /* press / focus inset for cream surfaces */
  --shadow-inset: inset 0 1px 2px rgba(25, 28, 25, 0.06);
  /* warm brand-tinted lift used on featured provider cards */
  --shadow-brand: 0 14px 34px rgba(85, 126, 38, 0.20);

  /* ---- Motion ---- */
  --dur-fast:  120ms; /* @kind other */
  --dur-base:  200ms; /* @kind other */
  --dur-slow:  320ms; /* @kind other */
  --ease-standard: cubic-bezier(0.2, 0.6, 0.2, 1);   /* @kind other */
  --ease-out:      cubic-bezier(0.16, 1, 0.3, 1);    /* @kind other */
  --ease-spring:   cubic-bezier(0.34, 1.4, 0.5, 1);  /* @kind other */

  /* ---- Z layers ---- */
  --z-base:    1;    /* @kind other */
  --z-sticky:  100;  /* @kind other */
  --z-nav:     200;  /* @kind other */
  --z-overlay: 800;  /* @kind other */
  --z-modal:   900;  /* @kind other */
  --z-toast:   1000; /* @kind other */

  /* ---- Container widths ---- */
  --container-app:    430px;  /* @kind other */
  --container-narrow: 720px;  /* @kind other */
  --container-wide:   1200px; /* @kind other */
}

/* ============================================================
   VELLO · BASE ELEMENT STYLES + TYPE UTILITIES
   Ships with the system so every surface inherits the brand.
   ============================================================ */

*,
*::before,
*::after { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  font-family: var(--font-sans);
  font-size: var(--text-base);
  line-height: var(--lh-normal);
  font-weight: var(--fw-regular);
  color: var(--text-body);
  background: var(--color-bg);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

::selection { background: var(--green-200); color: var(--ink-900); }

a { color: var(--text-link); text-decoration: none; }
a:hover { text-decoration: underline; }

h1, h2, h3, h4, h5 {
  font-family: var(--heading-font);
  font-weight: var(--heading-weight);
  color: var(--text-strong);
  line-height: var(--lh-snug);
  letter-spacing: var(--ls-snug);
  margin: 0;
  text-wrap: balance;
}

p { margin: 0; text-wrap: pretty; }

button { font-family: inherit; }

/* ---- Display / heading utilities ---- */
.v-display {
  font-family: var(--display-font);
  font-weight: var(--display-weight);
  font-size: var(--text-5xl);
  line-height: var(--lh-tight);
  letter-spacing: var(--ls-tight);
  color: var(--text-strong);
}
.v-h1 { font-family: var(--heading-font); font-weight: var(--fw-bold); font-size: var(--text-4xl); line-height: var(--lh-snug); letter-spacing: var(--ls-snug); color: var(--text-strong); }
.v-h2 { font-family: var(--heading-font); font-weight: var(--fw-semibold); font-size: var(--text-2xl); line-height: var(--lh-snug); letter-spacing: var(--ls-snug); color: var(--text-strong); }
.v-h3 { font-family: var(--heading-font); font-weight: var(--fw-semibold); font-size: var(--text-xl); line-height: var(--lh-snug); color: var(--text-strong); }

/* ---- Body ---- */
.v-body    { font-size: var(--text-base); line-height: var(--lh-relaxed); color: var(--text-body); }
.v-body-sm { font-size: var(--text-sm);   line-height: var(--lh-normal);  color: var(--text-body); }
.v-muted   { color: var(--text-muted); }

/* ---- Eyebrow / label ---- */
.v-eyebrow {
  font-family: var(--label-font);
  font-weight: var(--fw-bold);
  font-size: var(--text-xs);
  letter-spacing: var(--ls-wider);
  text-transform: uppercase;
  color: var(--text-brand);
}

/* ---- Mono (data) ---- */
.v-mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }

/* ===== ProviderCard.jsx styles ===== */
/* ProviderCard · v1 styles. Tokens from vendor/*.css; anything raw below is drift to audit. */
.pc {
  display: flex;
  gap: var(--space-4);
  align-items: flex-start;
  padding: var(--space-4);
  background: var(--surface-card);
  border: 1px solid var(--border-default);
  border-radius: var(--radius-lg);
  color: var(--text-body);
  text-decoration: none;
  transition: box-shadow var(--dur-fast) var(--ease-standard), border-color var(--dur-fast) var(--ease-standard), transform var(--dur-fast) var(--ease-standard);
}
.pc:hover { text-decoration: none; box-shadow: var(--shadow-md); border-color: var(--border-strong); transform: translateY(-1px); }
.pc:focus-visible { outline: none; box-shadow: var(--focus-ring); border-color: var(--border-focus); }
.pc--featured { box-shadow: var(--shadow-brand); }
@media (prefers-reduced-motion: reduce) { .pc { transition: none; } .pc:hover { transform: none; } }

.pc__avatar { position: relative; flex: 0 0 auto; width: 72px; height: 72px; }
.pc__photo, .pc__initials {
  display: block; width: 100%; height: 100%; border-radius: var(--radius-pill); object-fit: cover;
}
.pc__initials {
  display: grid; place-items: center; background: var(--brand-primary-tint); color: var(--text-brand);
  font-family: var(--font-display); font-weight: var(--fw-semibold); font-size: var(--text-lg);
}
.pc__mark {
  position: absolute; right: -2px; bottom: -2px; width: 22px; height: 22px;
  display: grid; place-items: center; border-radius: var(--radius-pill);
  background: var(--brand-primary); color: var(--text-on-brand); box-shadow: 0 0 0 2px var(--color-bg);
}
.pc__mark--pending { background: var(--warning); }
.pc__mark--top-rated { background: var(--rating); color: var(--text-strong); }
.pc__mark--unverified { background: var(--surface-sunken); color: var(--text-muted); }

.pc__body { display: flex; flex-direction: column; flex: 1 1 auto; min-width: 0; gap: var(--space-1); }
.pc__head { display: flex; align-items: center; gap: var(--space-2); }
.pc__name {
  font-family: var(--font-display); font-weight: var(--fw-semibold); font-size: var(--text-lg);
  line-height: var(--lh-snug); letter-spacing: var(--ls-snug); color: var(--text-strong);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.pc__badge {
  display: inline-flex; align-items: center; gap: var(--space-1); flex: 0 0 auto;
  padding: 0 var(--space-3); height: 24px; border-radius: var(--radius-pill);
  font-family: var(--font-sans); font-weight: var(--fw-semibold); font-size: var(--text-sm); line-height: 1;
}
.pc__badge--available { background: var(--accent-tint); color: var(--accent-press); }
.pc__badge--new { background: var(--brand-primary-tint); color: var(--text-brand); }
.pc__dot { width: 8px; height: 8px; border-radius: var(--radius-pill); background: var(--accent); }
.pc__chevron {
  margin-left: auto; flex: 0 0 auto; width: 40px; height: 40px; display: grid; place-items: center;
  border-radius: var(--radius-pill); background: var(--surface-sunken); color: var(--text-subtle);
}
.pc__summary {
  font-family: var(--font-sans); font-size: var(--text-sm); line-height: var(--lh-normal); color: var(--text-body);
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.pc__price { display: flex; align-items: baseline; gap: var(--space-2); margin-top: var(--space-2); color: var(--text-strong); }
.pc__from, .pc__amount, .pc__score, .pc__walk { font-family: var(--font-mono); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.pc__from { font-size: var(--text-base); }
.pc__amount { font-size: var(--text-md); font-weight: var(--fw-semibold); }
.pc__unit { font-family: var(--font-sans); font-size: var(--text-sm); color: var(--text-muted); }
.pc__meta { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); margin-top: var(--space-2); }
.pc__walk {
  display: inline-flex; align-items: center; gap: var(--space-1); height: 30px; padding: 0 var(--space-3);
  border-radius: var(--radius-pill); background: var(--green-50); border: 1px solid var(--green-200);
  color: var(--text-brand); font-size: var(--text-sm); font-weight: var(--fw-medium);
}
.pc__rating { display: inline-flex; align-items: center; gap: var(--space-2); }
.pc__stars { display: inline-flex; gap: 2px; color: var(--rating); }
.pc__score { font-size: var(--text-base); color: var(--text-strong); }
.pc__count { font-family: var(--font-sans); font-size: var(--text-sm); color: var(--text-muted); }
.pc__sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

</style>
